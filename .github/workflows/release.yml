name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos15
            target: aarch64-apple-darwin
            arch: arm64

    runs-on: ${{ matrix.runner }}

    env:
      SDKROOT: $(xcrun --sdk macosx --show-sdk-path)
      MACOSX_DEPLOYMENT_TARGET: 13.0

    steps:
      - uses: actions/checkout@v4

      - name: Fix Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> $GITHUB_ENV
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            macrdp-ui/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: macrdp-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd macrdp-ui && npm ci

      - name: Build CLI (release)
        env:
          SDKROOT: ${{ env.SDKROOT }}
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOSX_DEPLOYMENT_TARGET }}
        run: arch -arch ${{ matrix.arch }} cargo build -p macrdp-server --release

      - name: Verify binary
        run: |
          ls -la target/release/macrdp-server
          file target/release/macrdp-server

      - name: Build UI + DMG
        run: arch -arch ${{ matrix.arch }} cd macrdp-ui && npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Verify DMG
        run: |
          ls -la macrdp-ui/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-${{ matrix.arch }}
          path: macrdp-ui/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-server-${{ matrix.arch }}
          path: target/release/macrdp-server

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macrdp-aarch64/*.dmg
            artifacts/macrdp-server-aarch64/macrdp-server