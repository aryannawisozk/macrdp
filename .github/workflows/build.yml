name: Build macOS Binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify environment
        run: |
          echo "=== System Info ==="
          sw_vers
          echo ""
          echo "=== Rust ==="
          rustc --version
          cargo --version
          echo ""
          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version
          echo ""
          echo "=== Clang ==="
          which clang
          clang --version
          
      - name: Build CLI
        run: cargo build -p macrdp-server --release
        
      - name: Verify binary
        run: |
          ls -lh target/release/macrdp-server
          file target/release/macrdp-server
          
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-server-arm64
          path: target/release/macrdp-server
