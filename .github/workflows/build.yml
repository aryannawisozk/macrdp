name: Build macOS Binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          
      - name: Find clang
        run: |
          # Find clang directly without xcodebuild
          CLANG_PATH=$(which clang)
          echo "Using clang at: $CLANG_PATH"
          clang --version
          
      - name: Build CLI
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: cargo build -p macrdp-server --release
        
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-server-arm64
          path: target/release/macrdp-server
