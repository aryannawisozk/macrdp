name: Build macOS Binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos15
    fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix Xcode toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> $GITHUB_ENV
          xcodebuild -version
          echo "Xcode toolchain configured"

      - name: Verify Command Line Tools
        run: |
          set -euo pipefail
          echo "Verifying build tools..."
          which ar
          which clang
          which xcodebuild
          ar --version
          clang --version
          echo "All build tools verified"

      - name: Set SDKROOT and deployment target
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          
      - name: Build CLI
        env:
          SDKROOT: ${{ env.SDKROOT }}
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOSX_DEPLOYMENT_TARGET }}
        run: |
          set -euo pipefail
          arch -arch arm64 cargo build -p macrdp-server --release

      - name: Verify binary
        run: |
          set -euo pipefail
          ls -la target/release/macrdp-server
          file target/release/macrdp-server
          ./target/release/macrdp-server --version || true
          
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-server-arm64
          path: target/release/macrdp-server